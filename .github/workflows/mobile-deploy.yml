name: Deploy Android APK

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: true
        default: preview
        type: choice
        options:
          - preview

jobs:
  build-apk:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: findy-fe

    env:
      EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
      EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          missing=0

          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "Missing secret: EXPO_TOKEN"
            missing=1
          fi

          if [ -z "${{ secrets.EXPO_PUBLIC_API_URL }}" ]; then
            echo "Missing secret: EXPO_PUBLIC_API_URL"
            missing=1
          fi

          if [ "$missing" -eq 1 ]; then
            exit 1
          fi

          echo "All required secrets are configured."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: findy-fe/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK
        run: eas build --platform android --profile ${{ inputs.profile }} --non-interactive --wait
