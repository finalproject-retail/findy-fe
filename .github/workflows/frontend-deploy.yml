name: Deploy Frontend Web

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-northeast-2
  S3_BUCKET: s3-findy-frontend

jobs:
  deploy-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          missing=0

          if [ -z "${{ secrets.AWS_ROLE_ARN }}" ]; then
            echo "Missing secret: AWS_ROLE_ARN"
            missing=1
          fi

          if [ -z "${{ secrets.EXPO_PUBLIC_API_URL }}" ]; then
            echo "Missing secret: EXPO_PUBLIC_API_URL"
            missing=1
          fi

          if [ -z "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" ]; then
            echo "Missing secret: CLOUDFRONT_DISTRIBUTION_ID"
            missing=1
          fi

          if [ "$missing" -eq 1 ]; then
            exit 1
          fi

          echo "All required secrets are configured."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: findy-fe/package-lock.json

      - name: Install dependencies
        working-directory: findy-fe
        run: npm ci

      - name: Export web build
        working-directory: findy-fe
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
        run: npm run export:web

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload static files to S3
        run: |
          aws s3 sync findy-fe/dist "s3://${S3_BUCKET}" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"

          aws s3 cp findy-fe/dist/index.html "s3://${S3_BUCKET}/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
