name: Build and Push Frontend Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  INFRA_REPOSITORY: ${{ secrets.INFRA_REPOSITORY }}
  INFRA_REPOSITORY_BRANCH: ${{ secrets.INFRA_REPOSITORY_BRANCH }}
  INFRA_FRONTEND_IMAGE_FILE: ${{ secrets.INFRA_FRONTEND_IMAGE_FILE }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        working-directory: findy-fe
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --build-arg EXPO_PUBLIC_API_URL="${{ secrets.EXPO_PUBLIC_API_URL }}" \
            --build-arg EXPO_PUBLIC_MAP_API_URL="${{ secrets.EXPO_PUBLIC_MAP_API_URL }}" \
            --build-arg EXPO_PUBLIC_DEV_ACCESS_TOKEN="${{ secrets.EXPO_PUBLIC_DEV_ACCESS_TOKEN }}" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Checkout infra repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.INFRA_REPOSITORY }}
          ref: ${{ env.INFRA_REPOSITORY_BRANCH || 'main' }}
          token: ${{ secrets.INFRA_REPOSITORY_TOKEN }}
          path: infra

      - name: Update frontend image tag in infra repository
        working-directory: infra
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_FILE="${INFRA_FRONTEND_IMAGE_FILE:-apps/frontend/image.yaml}"
          mkdir -p "$(dirname "$IMAGE_FILE")"
          {
            echo "image:"
            echo "  repository: $ECR_REGISTRY/$ECR_REPOSITORY"
            echo "  tag: $IMAGE_TAG"
          } > "$IMAGE_FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$IMAGE_FILE"
          git commit -m "chore(frontend): update image to $IMAGE_TAG" || exit 0
          git push
