name: Build and Push Frontend Image

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: findy-frontend-ecr
  INFRA_REPOSITORY: finalproject-retail/findy-infra
  INFRA_BRANCH: dev
  INFRA_FRONTEND_IMAGE_FILE: k8s/frontend.yml

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          missing=0

          if [ -z "${{ secrets.AWS_ROLE_ARN }}" ]; then
            echo "Missing secret: AWS_ROLE_ARN"
            missing=1
          fi

          if [ -z "${{ secrets.EXPO_PUBLIC_API_URL }}" ]; then
            echo "Missing secret: EXPO_PUBLIC_API_URL"
            missing=1
          fi

          if [ -z "${{ secrets.EXPO_PUBLIC_MAP_API_URL }}" ]; then
            echo "Missing secret: EXPO_PUBLIC_MAP_API_URL"
            missing=1
          fi

          if [ -z "${{ secrets.EXPO_PUBLIC_DEV_ACCESS_TOKEN }}" ]; then
            echo "Missing secret: EXPO_PUBLIC_DEV_ACCESS_TOKEN"
            missing=1
          fi

          if [ -z "${{ secrets.INFRA_REPOSITORY_TOKEN }}" ]; then
            echo "Missing secret: INFRA_REPOSITORY_TOKEN"
            missing=1
          fi

          if [ "$missing" -eq 1 ]; then
            exit 1
          fi

          echo "All required secrets are configured."

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        working-directory: findy-fe
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --build-arg EXPO_PUBLIC_API_URL="${{ secrets.EXPO_PUBLIC_API_URL }}" \
            --build-arg EXPO_PUBLIC_MAP_API_URL="${{ secrets.EXPO_PUBLIC_MAP_API_URL }}" \
            --build-arg EXPO_PUBLIC_DEV_ACCESS_TOKEN="${{ secrets.EXPO_PUBLIC_DEV_ACCESS_TOKEN }}" \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            .

          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Checkout infra
        uses: actions/checkout@v4
        with:
          repository: ${{ env.INFRA_REPOSITORY }}
          ref: ${{ env.INFRA_BRANCH }}
          token: ${{ secrets.PAT }}
          path: infra

      - name: Update frontend Kubernetes manifest
        working-directory: infra
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          MANIFEST_FILE="${INFRA_FRONTEND_IMAGE_FILE}"

          if [ ! -f "$MANIFEST_FILE" ]; then
            echo "Kubernetes manifest not found: $MANIFEST_FILE"
            exit 1
          fi

          sed -i -E "s|image: .*${ECR_REPOSITORY}:.*|image: ${IMAGE}|" "$MANIFEST_FILE"

      - name: Commit and push infra changes
        working-directory: infra
        run: |
          if git diff --quiet; then
            echo "No infra image tag changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${INFRA_FRONTEND_IMAGE_FILE}"
          git commit -m "chore(frontend): update image to ${GITHUB_SHA}"
          git push origin "${INFRA_BRANCH}"