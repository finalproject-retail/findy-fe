# EAS Build/Submit 또는 EAS Update
name: Deploy Mobile

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        default: all
        type: choice
        options:
          - all
          - android
          - ios
      profile:
        description: EAS build profile
        required: true
        default: production
        type: choice
        options:
          - production
          - preview
      submit:
        description: Submit latest build to stores
        required: true
        default: false
        type: boolean

jobs:
  build-mobile:
    runs-on: ubuntu-latest

    env:
      EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
      EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_MAP_API_URL: ${{ secrets.EXPO_PUBLIC_MAP_API_URL }}
      EXPO_PUBLIC_DEV_ACCESS_TOKEN: ${{ secrets.EXPO_PUBLIC_DEV_ACCESS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build app
        run: eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive

      - name: Submit Android app
        if: ${{ inputs.submit && (inputs.platform == 'android' || inputs.platform == 'all') }}
        run: eas submit --platform android --latest --non-interactive

      - name: Submit iOS app
        if: ${{ inputs.submit && (inputs.platform == 'ios' || inputs.platform == 'all') }}
        run: eas submit --platform ios --latest --non-interactive
